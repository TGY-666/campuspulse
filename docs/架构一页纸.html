  <text x="76" y="796" font-size="14" font-weight="700" fill="#B45309" data-page-node-id="ppyhUeBX8GIX6s1GXVxqYU">① 结构上做不到</text>
  <text x="76" y="820" font-size="12.5" fill="#334155" data-page-node-id="Unu8kAKikQ0gpyQDM1QxnD">图表 option 由后端按工具返回值拼装，</text>
  <text x="76" y="840" font-size="12.5" fill="#334155" data-page-node-id="768bJIGj2ULSN3krqA3yfl">模型没有"往图里写数"的通道。</text>
  <text x="76" y="866" font-size="11.5" fill="#64748B" data-page-node-id="75k7xOzCnPFYyAXxdtvWpO">→ 幻觉可以污染文字，污染不了坐标轴</text>

  <rect x="562" y="768" width="486" height="120" rx="10" fill="#FFFFFF" stroke="#E2E8F0" data-page-node-id="Fbr4TEIPnBWFgCKHK8UmRu"/>
  <text x="582" y="796" font-size="14" font-weight="700" fill="#047857" data-page-node-id="iz0yW8m1CbIr9en1ic7CjD">② 写出来也要被查</text>
  <text x="582" y="820" font-size="12.5" fill="#334155" data-page-node-id="pVgh1Guza1h4em9Y0YfiBM">回答里每个数字回溯工具结果，对不上就整段</text>
  <text x="582" y="840" font-size="12.5" fill="#334155" data-page-node-id="DG5SbrW9ZZX3NoPK7vqPrS">替换成统计口径的直述，并标记"需复核"。</text>
  <text x="582" y="866" font-size="11.5" fill="#64748B" data-page-node-id="lrwnZcTnzgC0WNuRozpPUN">→ 验收里这是硬断言，不是"我们尽力了"</text>

  <rect x="1068" y="768" width="476" height="120" rx="10" fill="#FFFFFF" stroke="#E2E8F0" data-page-node-id="AKIpEcGx0ZKObg4AiCQIoO"/>
  <text x="1088" y="796" font-size="14" font-weight="700" fill="#6D28D9" data-page-node-id="HSyMrmKAfy3xCC8j6RTCtX">③ 说"人话"必须有出处</text>
  <text x="1088" y="820" font-size="12.5" fill="#334155" data-page-node-id="P3YWqaLaG2iug2JtxJxRAk">要引用就只能引检索到的片段编号，</text>
  <text x="1088" y="840" font-size="12.5" fill="#334155" data-page-node-id="Rtx8bo0ryjWNpNCJySTeNU">编号对不上原文即判引用失败。</text>
  <text x="1088" y="866" font-size="11.5" fill="#64748B" data-page-node-id="qKSCIkD8Rk7WDH82Sr5df6">→ 空数据时必须直说"查不到"，不许补</text>

  <!-- ===== 底部：边界（诚实） ===== -->
  <rect x="56" y="912" width="1488" height="112" rx="10" fill="#FFFBEB" stroke="#FDE68A" data-page-node-id="zbGEmWOGTn12wzi2hxxVSS"/>
  <text x="76" y="940" font-size="14" font-weight="700" fill="#B45309" data-page-node-id="6FBNH0UdMrJ1HLnCcIbeP5">已知边界（写进文档，也写进页面）</text>
  <text x="76" y="966" font-size="12.5" fill="#334155" data-page-node-id="vFKZZaKtdZkittzU4WPfEi">
    ① 数据来自两个平台的公开评论，不代表全校师生；② 维度是多标签计数，一条评论可命中多个维度，占比分母要看清；
  </text>
  <text x="76" y="990" font-size="12.5" fill="#334155" data-page-node-id="AKPaKz2cPHTv9TbV4dehco">
    ③ 不做事件级聚类（口语短文本上不稳定，宁可说"做不到"）；④ 检索是库内检索，不是全网；⑤ 限流按来源 IP，同出口 NAT 会共享额度。
  </text>
  <text x="76" y="1012" font-size="11.5" fill="#92400E" data-page-node-id="jqvZ73n0mzyGiVP7OZWa4w">
    一句话：这套系统能告诉你"这 1,803 条里负面集中在哪、原话是什么"，不能告诉你"全网都在骂"。
  </text>
